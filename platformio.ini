[platformio]
default_envs = esp32-s3-devkitc-1

; ---------------------------------------------------------------------------
; Target: ESP32-S3 DevKitC-1. Connect via the socket marked "USB" (native USB,
; Serial). Output is also mirrored to UART0 (Serial0) on the "COM" socket.
; ---------------------------------------------------------------------------
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    -I include
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Audio files live in data/ and are flashed to LittleFS with: pio run -t uploadfs
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
; Native tests are host-only; don't try to build them for the target.
test_ignore = *

; ---------------------------------------------------------------------------
; Host build for unit tests of the Arduino-free decoder logic in lib/.
;   pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
lib_deps =
